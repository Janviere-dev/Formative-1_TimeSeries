services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: traffic
      MYSQL_USER: traffic
      MYSQL_PASSWORD: traffic
    ports:
      - "3306:3306"
    volumes:
      - ./SQL/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8001:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: traffic
      MYSQL_PASSWORD: traffic
      MYSQL_DATABASE: traffic
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: traffic
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
