services:
  - type: web
    name: traffic-api
    runtime: python
    plan: free
    branch: feature/traffic-data-eda
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: INIT_ON_STARTUP
        value: "false"
